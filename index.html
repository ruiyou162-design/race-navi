<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>競技当日ナビ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0)}
header{position:sticky;top:0;z-index:5;background:#0f172a;color:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:1.1rem;font-weight:900}
main{max-width:560px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;border:2px solid #cbd5e1;background:#fff;color:#0f172a;padding:12px 14px}
button.on{background:#0f766e;border-color:#0f766e;color:#fff}
button.y{background:#fde047;border-color:#fde047;color:#000;font-weight:900;padding:8px 14px}
label{display:block;font-weight:700;font-size:.85rem}
input,textarea{width:100%;font:inherit;font-size:1.1rem;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a;margin-top:3px}
textarea{min-height:130px;resize:vertical}
.stack{display:grid;gap:10px}
.alert{background:#dc2626;color:#fff;border-radius:12px;padding:14px;font-weight:900;font-size:1.05rem}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.tl li:last-child{border:0;color:#dc2626}
.tl .t{font-size:2.2rem;font-weight:900;font-variant-numeric:tabular-nums;width:7rem}
.tl .n{font-size:1.5rem;font-weight:700}
.chk label{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:1rem;font-weight:500}
.chk input{width:24px;height:24px;margin:0;accent-color:#0f766e}
.chk input:checked+span{text-decoration:line-through;color:#94a3b8}
h2{margin:0 0 6px;font-size:1.05rem;font-weight:900;display:flex;justify-content:space-between}
a.go{display:block;text-align:center;background:#0f766e;color:#fff;font-weight:900;font-size:1.1rem;border-radius:12px;padding:14px;text-decoration:none}
.ov{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;gap:12px;padding:calc(12px + env(safe-area-inset-top,0)) 14px calc(12px + env(safe-area-inset-bottom,0));overflow:auto;background:#000;color:#fde047}
.ov.on{display:flex}
.ov .bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ov .bar span{color:#fff;font-weight:700}
.ov button{background:#fff;color:#000;border-color:#fff}
.big{border:4px solid #fde047;border-radius:16px;padding:14px;text-align:center}
.big .tm{font-size:clamp(4.5rem,28vw,10rem);font-weight:900;line-height:1}
.big .tx{font-size:3rem;font-weight:900;color:#fff;margin-top:8px}
.ev{border:4px solid #fff;border-radius:16px;padding:14px;text-align:center}
.ev .e{font-size:3.6rem;font-weight:900}
.ev .h{font-size:2.4rem;font-weight:900;color:#fff}
.waist{background:#dc2626;color:#fff;border-radius:16px;padding:14px;font-size:2.4rem;font-weight:900;text-align:center}
.nav{display:flex;gap:8px;margin-top:auto}
.nav button{flex:1;font-size:1.4rem;padding:14px}
#pad{flex:1;min-height:55vh;background:#000;color:#fde047;border:4px solid #fde047;font-size:3rem;font-weight:900;line-height:1.3}
</style>
</head>
<body>
<header><b>競技当日ナビ</b><span style="display:flex;gap:6px"><button class="y" id="bpad">筆談</button><button class="y" id="binfo">情報表示モード</button></span></header>
<main>
  <section class="card"><div class="grid2" id="cats"></div><div class="chips" id="evs"></div></section>
  <div class="alert" id="waistmsg" hidden>3000m以上の種目のため、招集所で腰ナンバー（レーン番号ゼッケン）の受け取りと装着が必要です</div>
  <section class="card stack">
    <label>大会名<input id="name" value="〇〇陸上競技記録会"></label>
    <div class="grid2">
      <label>開門<input id="gate" type="time" value="07:30"></label>
      <label>競技開始<input id="start" type="time" value="10:30"></label>
    </div>
    <div class="grid2">
      <label>組<input id="heat" inputmode="numeric" value="3"></label>
      <label>レーン<input id="lane" inputmode="numeric" value="5"></label>
    </div>
    <div class="grid2">
      <label>招集開始（分前）<input id="open" type="number" inputmode="numeric" min="0" step="5"></label>
      <label>招集完了（分前）<input id="close" type="number" inputmode="numeric" min="0" step="5"></label>
    </div>
    <label>記録速報サイトURL<input id="url" type="url" placeholder="https://"></label>
  </section>
  <section class="card"><ol class="tl" id="tl"></ol></section>
  <section class="card chk"><h2>持ち物<span id="cnt" style="color:#0f766e"></span></h2><div id="items"></div></section>
  <section class="card"><h2>メモ</h2><textarea id="memo" placeholder="自由にメモ"></textarea></section>
  <a class="go" id="link" hidden target="_blank" rel="noopener noreferrer">記録速報サイトを開く</a>
</main>

<div class="ov" id="info">
  <div class="bar"><span id="iname"></span><button id="iclose">閉じる</button></div>
  <div class="big"><div class="tm" id="itm"></div><div class="tx" id="itx"></div></div>
  <div class="ev"><div class="e" id="iev"></div><div class="h" id="ihl"></div></div>
  <div class="waist" id="iwaist" hidden>腰ナンバー</div>
  <div class="nav"><button id="prev">◀</button><button id="auto">自動</button><button id="nextb">▶</button></div>
</div>

<div class="ov" id="padov">
  <div class="bar"><span>筆談</span><span style="display:flex;gap:6px"><button id="fm">A−</button><button id="fp">A＋</button><button id="clr">消す</button><button id="pclose">閉じる</button></span></div>
  <textarea id="pad" placeholder="ここに書いて相手に見せる"></textarea>
</div>

<script>
var CATS=[
 {id:"sprint",label:"短距離・ハードル",ev:["100m","200m","400m","100mH/110mH","400mH"]},
 {id:"mid",label:"中距離",ev:["800m","1500m"]},
 {id:"long",label:"長距離・競歩",ev:["3000m","5000m","10000m","3000mSC","5000mW"]},
 {id:"field",label:"跳躍・投てき",ev:["走幅跳","走高跳","砲丸投","やり投","棒高跳"]}];
var WAIST=["3000m","5000m","10000m","3000mSC"];
var COMMON=["アスリートビブス（ゼッケン）の作成・確認","安全ピン","ユニフォーム","スパイク","補給食","飲み物・タオル","防寒具"];
var EXTRA={sprint:[],mid:[],long:["エネルギージェル"],field:["マーク用テープ"]};
var S={cat:"mid",ev:"800m",checked:{},manual:null};
var $=function(i){return document.getElementById(i)};

function defCalls(c){return c==="field"?[40,30]:[30,20]}
function toMin(s){var m=/^(\d{1,2}):(\d{2})/.exec(s||"");return m?+m[1]*60+ +m[2]:null}
function fmt(m){if(m==null||!isFinite(m))return"--:--";var v=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(v/60)).padStart(2,"0")+":"+String(v%60).padStart(2,"0")}
function build(){
  var st=toMin($("start").value),g=toMin($("gate").value);if(st==null)return[];
  var o=+$("open").value||0,c=+$("close").value||0,f=S.cat==="field",pr=S.ev==="棒高跳"?60:c;
  var a=[{t:st-240,x:"食事"}];
  if(g!=null)a.push({t:g,x:"開門"});
  a.push({t:st-120,x:"アップ"},{t:st-o,x:"招集開始"},{t:st-c,x:"招集完了"});
  if(f)a.push({t:st-pr,x:"公式練習"});
  a.push({t:st,x:"競技"});
  return a.sort(function(p,q){return p.t-q.t});
}
function items(){return(WAIST.indexOf(S.ev)>=0?["腰ナンバー"]:[]).concat(COMMON,EXTRA[S.cat])}
function save(){try{localStorage.setItem("tan",JSON.stringify({cat:S.cat,ev:S.ev,checked:S.checked,f:["name","gate","start","heat","lane","open","close","url","memo"].map(function(i){return $(i).value})}))}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem("tan")||"null");if(!d)return false;S.cat=d.cat;S.ev=d.ev;S.checked=d.checked||{};["name","gate","start","heat","lane","open","close","url","memo"].forEach(function(i,k){$(i).value=d.f[k]});return true}catch(e){return false}}

function renderTop(){
  $("cats").innerHTML=CATS.map(function(c){return'<button data-c="'+c.id+'" class="'+(c.id===S.cat?"on":"")+'">'+c.label+'</button>'}).join("");
  var cat=CATS.filter(function(c){return c.id===S.cat})[0];
  $("evs").innerHTML=cat.ev.map(function(e){return'<button data-e="'+e+'" class="'+(e===S.ev?"on":"")+'">'+e+'</button>'}).join("");
  $("waistmsg").hidden=WAIST.indexOf(S.ev)<0;
}
function renderList(){
  var tl=build();
  $("tl").innerHTML=tl.length?tl.map(function(x){return'<li><span class="t">'+fmt(x.t)+'</span><span class="n">'+x.x+'</span></li>'}).join(""):'<li style="color:#64748b">競技開始を入力</li>';
  var it=items(),n=0;
  $("items").innerHTML=it.map(function(x,i){var c=S.checked[x]?1:0;n+=c;return'<label><input type="checkbox" data-i="'+i+'"'+(c?" checked":"")+'><span>'+x+'</span></label>'}).join("");
  $("cnt").textContent=n+"/"+it.length;
  var u=$("url").value.trim();$("link").hidden=!u;if(u)$("link").href=u;
  save();
}
function renderInfo(){
  var tl=build(),d=new Date(),now=d.getHours()*60+d.getMinutes(),i=-1,k;
  for(k=0;k<tl.length;k++){if(tl[k].t>=now){i=k;break}}
  if(i<0)i=Math.max(tl.length-1,0);
  if(S.manual!=null)i=Math.min(Math.max(S.manual,0),Math.max(tl.length-1,0));
  S.idx=i;var x=tl[i];
  $("iname").textContent=$("name").value;
  $("itm").textContent=x?fmt(x.t):"--:--";$("itx").textContent=x?x.x:"";
  $("iev").textContent=S.ev;
  $("ihl").textContent=[$("heat").value&&$("heat").value+"組",$("lane").value&&$("lane").value+"レーン"].filter(Boolean).join("　");
  $("iwaist").hidden=WAIST.indexOf(S.ev)<0;
}
function setCalls(){var c=defCalls(S.cat);$("open").value=c[0];$("close").value=c[1]}

$("cats").onclick=function(e){var c=e.target.getAttribute("data-c");if(!c)return;S.cat=c;S.ev=CATS.filter(function(x){return x.id===c})[0].ev[0];setCalls();renderTop();renderList()};
$("evs").onclick=function(e){var v=e.target.getAttribute("data-e");if(!v)return;S.ev=v;renderTop();renderList()};
$("items").onchange=function(e){var i=e.target.getAttribute("data-i");if(i==null)return;S.checked[items()[i]]=e.target.checked;renderList()};
["name","gate","start","heat","lane","open","close","url","memo"].forEach(function(i){$(i).addEventListener("input",renderList)});
var timer=null;
$("binfo").onclick=function(){S.manual=null;renderInfo();$("info").classList.add("on");timer=setInterval(function(){if(S.manual==null)renderInfo()},15000);try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(function(){})}catch(e){}};
$("iclose").onclick=function(){$("info").classList.remove("on");clearInterval(timer)};
$("prev").onclick=function(){S.manual=S.idx-1;renderInfo()};
$("nextb").onclick=function(){S.manual=S.idx+1;renderInfo()};
$("auto").onclick=function(){S.manual=null;renderInfo()};
var fs=3;
$("bpad").onclick=function(){$("padov").classList.add("on");$("pad").focus()};
$("pclose").onclick=function(){$("padov").classList.remove("on")};
$("clr").onclick=function(){$("pad").value="";$("pad").focus()};
$("fp").onclick=function(){fs=Math.min(fs+.5,7);$("pad").style.fontSize=fs+"rem"};
$("fm").onclick=function(){fs=Math.max(fs-.5,1.5);$("pad").style.fontSize=fs+"rem"};

setCalls();
if(load()){}
renderTop();renderList();
</script>
</body>
</html>
